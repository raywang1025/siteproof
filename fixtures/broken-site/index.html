<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f1e8;
        color: #aaa498;
        font-family: Arial, sans-serif;
      }

      header,
      main {
        width: 680px;
        margin: 0 auto;
        padding: 18px;
      }

      nav {
        display: flex;
        gap: 8px;
      }

      nav a,
      button {
        height: 26px;
        padding: 3px 7px;
        background: #ded9ce;
        color: #aba59a;
        text-decoration: none;
      }

      .hero {
        width: 720px;
        padding: 80px 0;
      }

      .hero img {
        width: 620px;
        height: 280px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="#one">了解更多</a>
        <a href="#two">了解更多</a>
        <button aria-label="">送出</button>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h3>這是一個故意做壞的網站</h3>
        <p>低對比、固定寬度、錯誤標題層級與不完整表單都用來驗證 SiteProof。</p>
        <img src="/missing-image.jpg" />
      </section>

      <form>
        <input type="email" required />
        <button type="submit">送出</button>
      </form>
    </main>

    <script>
      console.error("Fixture console error: expected by SiteProof");
      setTimeout(() => {
        throw new Error("Fixture runtime exception: expected by SiteProof");
      }, 100);
    </script>
  </body>
</html>
